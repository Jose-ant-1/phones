<h3>Cart</h3>

<p>
  <a routerLink="/shipping">Shipping Prices</a>
</p>

@for (item of items; track item.id) {
  <div class="cart-item" style="display: flex; gap: 15px; align-items: center; margin-bottom: 10px;">
    <span>{{ item.name }}</span>
    <span>{{ (item.price * item.quantity) | currency }}</span>

    <div class="quantity-controls">
      <button type="button" (click)="onDecrement(item)">-</button>
      <span style="margin: 0 8px; font-weight: bold;">{{ item.quantity }}</span>
      <button type="button" (click)="onIncrement(item)">+</button>
    </div>
  </div>
}

<form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="name">NAME</label>
    <input id="name" type="text" formControlName="name">
  </div>

  <div>
    <label for="address">ADDRESS</label>
    <input id="address" type="text" formControlName="address">
  </div>

  <button class="button" type="submit">Purchase</button>
</form>
